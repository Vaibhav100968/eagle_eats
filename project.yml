name: eaglesEats2
options:
  bundleIdPrefix: com.vaibhav08
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

targets:
  eaglesEats2:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - "*.xcodeproj/**"
          - ".gitignore"
          - ".claude/**"
          - ".derivedData/**"
          - "EagleEatsWidget/**"
          - "backend/**"
          - "docs/**"
          - ".github/**"
          - "Secrets.plist.example"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mean Eats
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: "Mean Eats uses your location to show the nearest UNT dining halls."
        NSCameraUsageDescription: "Mean Eats uses the camera so you can add photos to menu item reviews."
        NSPhotoLibraryUsageDescription: "Mean Eats accesses your photo library so you can attach photos to menu reviews."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaibhavg.meaneats.app2
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BJ5CP7G4SR
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: EagleEatsWidget
        embed: true
    entitlements:
      path: eaglesEats2.entitlements

  EagleEatsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: EagleEatsWidget
      - path: Models/WidgetModels.swift
    info:
      path: EagleEatsWidget/Info.plist
      properties:
        CFBundleDisplayName: Mean Eats Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaibhavg.meaneats.app2.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BJ5CP7G4SR
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: EagleEatsWidget/EagleEatsWidget.entitlements

schemes:
  eaglesEats2:
    build:
      targets:
        eaglesEats2: all
        EagleEatsWidget: all
    run:
      config: Debug
      executable: eaglesEats2
    test:
      config: Debug
      targets:
        - eaglesEats2
    profile:
      config: Release
      executable: eaglesEats2
    analyze:
      config: Debug
      target: eaglesEats2
    archive:
      config: Release
      target: eaglesEats2
